<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睡觉比格犬</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
        }
        .container {
            position: relative;
            width: 500px;
            height: 500px;
        }
        .dog-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .zzz {
            position: absolute;
            top: 80px;
            right: 120px;
            font-family: 'Arial', sans-serif;
            font-size: 48px;
            font-weight: bold;
            color: #8B4513;
            animation: float 2s ease-in-out infinite;
        }
        .z1 {
            animation-delay: 0s;
            font-size: 48px;
        }
        .z2 {
            position: absolute;
            top: 55px;
            right: 90px;
            font-size: 36px;
            animation-delay: 0.3s;
        }
        .z3 {
            position: absolute;
            top: 30px;
            right: 60px;
            font-size: 24px;
            animation-delay: 0.6s;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
                opacity: 0.9;
            }
            50% {
                transform: translateY(-10px) rotate(5deg);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="睡觉比格犬.png" alt="睡觉比格犬" class="dog-image">
        <div class="zzz z1">Z</div>
        <div class="zzz z2">Z</div>
        <div class="zzz z3">Z</div>
    </div>
</body>
</html>
